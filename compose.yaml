services:
  app:
    build:
      context: .
      target: app
    init: true
    # The app and the relay share one origin here, so the server's same-origin check needs no ALLOWED_ORIGINS.
    ports:
      - "127.0.0.1:${CLIENT_PORT:-4200}:3000"

  dev:
    profiles: ["dev"]
    build:
      context: .
      target: dev
    init: true
    ports:
      - "127.0.0.1:${CLIENT_PORT:-4200}:4200"
    environment:
      # The browser's Origin carries the published host port, so the server's allow-list must follow CLIENT_PORT.
      ALLOWED_ORIGINS: "http://localhost:${CLIENT_PORT:-4200},http://127.0.0.1:${CLIENT_PORT:-4200}"
    volumes:
      - .:/app
      - root_node_modules:/app/node_modules
      - shared_node_modules:/app/shared/node_modules
      - server_node_modules:/app/server/node_modules
      - client_node_modules:/app/client/node_modules

volumes:
  root_node_modules:
  shared_node_modules:
  server_node_modules:
  client_node_modules:
